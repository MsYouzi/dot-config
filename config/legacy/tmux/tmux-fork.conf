# Catppuccin Mocha tmux theme — FORK-OWNED OVERRIDE.
#
# WHY THIS FILE EXISTS — read before folding it back into .tmux.conf.
# This repo is a fork of D0n9X1n/dot-config (the `source` remote). Upstream's
# tmux theme is Gruvbox Dark Hard; this fork is Catppuccin Mocha. The palette
# used to be edited directly into upstream's status-bar block, so every upstream
# touch of those lines collided, and resolving a conflict the natural way
# ("keep ours") is exactly what restores Gruvbox.
#
# Instead: upstream's theme block is left EXACTLY as upstream wrote it, and
# .tmux.conf sources this file at the very end. tmux applies settings in order,
# so whatever is set last wins — these values override upstream's regardless of
# what upstream's became. A pull that retunes Gruvbox merges cleanly and changes
# nothing about what renders.
#
# Consequences worth knowing:
#   - Edit tmux colors HERE, not in .tmux.conf.
#   - Sourced with `-q`, so a missing file is not an error: tmux falls back to
#     upstream's Gruvbox. Degraded, never broken.
#   - Only re-sets options upstream already sets. It does not add new ones, so
#     it cannot mask an upstream feature — just recolor it.
#
# Palette matches wezterm/palette-fork.lua, themes/apollo/statusline-palette.sh,
# and .sonicterm/themes/catppuccin-mocha.toml. Values are WezTerm's builtin
# "Catppuccin Mocha".
#
#   base     #1e1e2e   surface0 #313244   overlay0 #6c7086   text     #cdd6f4
#   crust    #11111b   surface1 #45475a   subtext0 #a6adc8
#   yellow   #f9e2af   blue     #89b4fa   red      #f38ba8

# Status bar. bg uses `base` (#1e1e2e), one step lighter than the WezTerm canvas
# `crust` (#11111b), so the bar reads as a distinct surface — the same
# relationship the Gruvbox setup had (#1d2021 bar over #141617 canvas).
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#f9e2af,bold]  #S #[fg=#f9e2af,bg=#1e1e2e,nobold]  "
set -g status-right "#{?client_prefix,#[fg=#f38ba8]󰌌 PREFIX  ,}#[fg=#89b4fa]󰥔 %H:%M #[fg=#6c7086]│#[fg=#a6adc8] %Y-%m-%d "

# Window list — inactive in dim grey on surface0; active in dark text on a
# Catppuccin blue pill. `#{?window_zoomed_flag, ,}` adds a magnifier when zoomed.
set -g window-status-format         "#[fg=#6c7086,bg=#313244]  #I·#W  "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold]  #I·#W#{?window_zoomed_flag, ,}  "
setw -g window-status-activity-style "fg=#f38ba8,bg=#313244,bold"

# Pane border — inactive sits on surface1, active glows with yellow.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af"

# Command prompt / message bar and copy-mode selection.
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g message-command-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g mode-style "bg=#f9e2af,fg=#1e1e2e,bold"
