# Fork-owned eza adapter; scripts/catppuccin-theme.sh copies it into the runtime bundle.
# Edit colors here and keep shared roles aligned with scripts/theme/catppuccin-mocha.json.
colourful: true
filekinds:
  normal: {foreground: "#cdd6f4"}
  directory: {foreground: "#89b4fa", is_bold: true}
  symlink: {foreground: "#94e2d5"}
  pipe: {foreground: "#f9e2af"}
  block_device: {foreground: "#f5c2e7"}
  char_device: {foreground: "#f5c2e7"}
  socket: {foreground: "#a6e3a1"}
  special: {foreground: "#f9e2af"}
  executable: {foreground: "#a6e3a1", is_bold: true}
  mount_point: {foreground: "#89b4fa", is_bold: true}
perms:
  user_read: {foreground: "#cdd6f4"}
  user_write: {foreground: "#f9e2af"}
  user_execute_file: {foreground: "#a6e3a1"}
  user_execute_other: {foreground: "#a6e3a1"}
  group_read: {foreground: "#bac2de"}
  group_write: {foreground: "#f9e2af"}
  group_execute: {foreground: "#a6e3a1"}
  other_read: {foreground: "#6c7086"}
  other_write: {foreground: "#f38ba8"}
  other_execute: {foreground: "#a6e3a1"}
  special_user_file: {foreground: "#f38ba8", is_bold: true}
  special_other: {foreground: "#f9e2af", is_bold: true}
  attribute: {foreground: "#94e2d5"}
size:
  major: {foreground: "#f5c2e7"}
  minor: {foreground: "#f5c2e7"}
  number_byte: {foreground: "#6c7086"}
  number_kilo: {foreground: "#cdd6f4"}
  number_mega: {foreground: "#89b4fa"}
  number_giga: {foreground: "#f9e2af"}
  number_huge: {foreground: "#f38ba8"}
  unit_byte: {foreground: "#6c7086"}
  unit_kilo: {foreground: "#6c7086"}
  unit_mega: {foreground: "#bac2de"}
  unit_giga: {foreground: "#f9e2af"}
  unit_huge: {foreground: "#f38ba8"}
users:
  user_you: {foreground: "#f9e2af"}
  user_root: {foreground: "#f38ba8", is_bold: true}
  user_other: {foreground: "#bac2de"}
  group_yours: {foreground: "#94e2d5"}
  group_other: {foreground: "#6c7086"}
  group_root: {foreground: "#f38ba8"}
links:
  normal: {foreground: "#6c7086"}
  multi_link_file: {foreground: "#89b4fa"}
git:
  new: {foreground: "#a6e3a1"}
  modified: {foreground: "#f9e2af"}
  deleted: {foreground: "#f38ba8"}
  renamed: {foreground: "#94e2d5"}
  typechange: {foreground: "#f5c2e7"}
  ignored: {foreground: "#6c7086"}
  conflicted: {foreground: "#f38ba8", is_bold: true}
git_repo:
  branch_main: {foreground: "#f9e2af", is_bold: true}
  branch_other: {foreground: "#89b4fa"}
  git_clean: {foreground: "#a6e3a1"}
  git_dirty: {foreground: "#f9e2af"}
file_type:
  image: {foreground: "#f5c2e7"}
  video: {foreground: "#f5c2e7"}
  music: {foreground: "#94e2d5"}
  lossless: {foreground: "#94e2d5"}
  crypto: {foreground: "#f38ba8"}
  document: {foreground: "#bac2de"}
  compressed: {foreground: "#f9e2af"}
  temp: {foreground: "#6c7086"}
  compiled: {foreground: "#f38ba8"}
  build: {foreground: "#f9e2af"}
  source: {foreground: "#89b4fa"}
punctuation: {foreground: "#6c7086"}
date: {foreground: "#bac2de"}
inode: {foreground: "#6c7086"}
blocks: {foreground: "#6c7086"}
header: {foreground: "#f9e2af", is_bold: true}
octal: {foreground: "#f5c2e7"}
flags: {foreground: "#94e2d5"}
symlink_path: {foreground: "#94e2d5"}
control_char: {foreground: "#f38ba8"}
broken_symlink: {foreground: "#f38ba8"}
broken_path_overlay: {foreground: "#f38ba8", is_underline: true}
