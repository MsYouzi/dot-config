# Fork-owned RMUX adapter; scripts/catppuccin-theme.sh copies it into the runtime bundle.
# Edit colors here and keep shared roles aligned with scripts/theme/catppuccin-mocha.json.
set-option -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set-option -g status-left-style "bg=#f9e2af,fg=#1e1e2e,bold"
set-option -g status-right-style "bg=#1e1e2e,fg=#bac2de"
set-window-option -g window-status-style "bg=#313244,fg=#6c7086"
set-window-option -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set-window-option -g window-status-activity-style "bg=#313244,fg=#f38ba8,bold"
set-window-option -g window-status-bell-style "bg=#f38ba8,fg=#1e1e2e,bold"
set-option -g pane-border-style "fg=#45475a"
set-option -g pane-active-border-style "fg=#f9e2af"
set-option -g display-panes-colour "#89b4fa"
set-option -g display-panes-active-colour "#f9e2af"
set-option -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
set-option -g message-command-style "bg=#89b4fa,fg=#1e1e2e,bold"
set-window-option -g mode-style "bg=#f9e2af,fg=#1e1e2e,bold"
set-window-option -g copy-mode-match-style "bg=#a6e3a1,fg=#1e1e2e"
set-window-option -g copy-mode-current-match-style "bg=#f5c2e7,fg=#1e1e2e,bold"
