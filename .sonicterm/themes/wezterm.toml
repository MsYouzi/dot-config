# SonicTerm default: WezTerm's Catppuccin Mocha palette with a custom
# near-black background tuned for SonicTerm chrome.
name = "Modified Catppuccin Mocha"
appearance = "dark"

[colors]
# Background uses Catppuccin `crust` (#11111b) rather than the scheme's
# `base` (#1e1e2e) — same one-step-deeper canvas the WezTerm config uses.
background    = "#11111b"
foreground    = "#cdd6f4"
# Cursor: `rosewater` on `crust`, matching WezTerm's builtin cursor_bg/fg
# for this scheme exactly.
cursor        = "#f5e0dc"
cursor_text   = "#11111b"
# Selection: catppuccin surface2 (#585b70) — matches WezTerm's builtin
# selection_bg for Catppuccin Mocha. The renderer paints this as a
# translucent quad so text underneath keeps its original color (no fg
# override applied), mirroring WezTerm's default selection behavior.
selection_bg  = "#585b70"
selection_fg  = "#cdd6f4"

# ANSI palette mirrors WezTerm's built-in "Catppuccin Mocha" color scheme,
# which is what the user selects via
#   config.color_scheme = "Catppuccin Mocha"
# in their wezterm.lua. Values pinned for exact parity.
#
# Read directly out of the installed WezTerm binary (20240203-110809-5046fc22)
# via wezterm.color.get_builtin_schemes()['Catppuccin Mocha'] — NOT copied
# from catppuccin/palette. The two disagree on two slots: WezTerm assigns
# subtext1 (#bac2de) to normal white and subtext0 (#a6adc8) to bright white,
# where the upstream palette JSON has them the other way round, and WezTerm
# maps normal+bright to the same hex for red/green/yellow/blue/magenta/cyan
# instead of using the palette's distinct bright variants. Pinning to the
# binary is what keeps SonicTerm and WezTerm pixel-identical; re-deriving
# these from the palette site will silently break parity.
[colors.ansi]
black   = "#45475a"  # surface1
red     = "#f38ba8"  # red
green   = "#a6e3a1"  # green
yellow  = "#f9e2af"  # yellow
blue    = "#89b4fa"  # blue
magenta = "#f5c2e7"  # pink
cyan    = "#94e2d5"  # teal
white   = "#bac2de"  # subtext1

[colors.bright]
black   = "#585b70"  # surface2
red     = "#f38ba8"  # red
green   = "#a6e3a1"  # green
yellow  = "#f9e2af"  # yellow
blue    = "#89b4fa"  # blue
magenta = "#f5c2e7"  # pink
cyan    = "#94e2d5"  # teal
white   = "#a6adc8"  # subtext0

[colors.tab]
bar_bg          = "#11111b"
active_bg       = "#11111b"
active_fg       = "#f9e2af"
inactive_bg     = "#11111b"
inactive_fg     = "#6c7086"
hover_bg        = "#181825"
hover_fg        = "#bac2de"
close_button_fg = "#f38ba8"
